<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Lists Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding-top: 50px;
        }
        .list-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        #existingLists .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .list-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="list-container">
                    <h2 class="mb-4">Create New Shopping List</h2>
                    <div class="mb-3">
                        <input type="text" id="newListName" class="form-control" placeholder="Enter list name">
                    </div>
                    <button id="createListBtn" class="btn btn-primary">Create List</button>
                </div>

                <div class="list-container">
                    <h2 class="mb-4">Existing Shopping Lists</h2>
                    <div id="existingLists">
                        <!-- Existing lists will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { Aworset } =import('./crdt/Aworset.js');
        // DOM Elements
        const newListNameInput = document.getElementById('newListName');
        const createListBtn = document.getElementById('createListBtn');
        const existingListsContainer = document.getElementById('existingLists');
        const port = getport();
        
        function getMachineId() {
            let machineId = localStorage.getItem('MachineId');
            if (!machineId) {
                machineId = crypto.randomUUID();
                localStorage.setItem('MachineId', machineId);
            }
            // append port to machineId
            machineId = machineId + getport();
            return machineId;
        }

        function getport(){
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('port');
        }

        // Create a new list
        createListBtn.addEventListener('click', async () => {
            const listName = newListNameInput.value.trim();
            console.log(listName);
            
            if (!listName) {
                alert('Please enter a list name');
                return;
            }

            try {
                const response = await fetch(`http://localhost:${port}/api/lists`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: listName ,uniqueId: getMachineId()}),
                });
                console.log(response);

                const result = await response.json();
                
                if (result.success) {
                    // Reload lists
                    loadExistingLists();
                } else {
                    alert('Failed to delete list');
                }
                // Clear input
                newListNameInput.value = '';
                    
            } catch (error) {
                console.error('Error creating list:', error);
                alert('Failed to create list');
            }
        });

        // Load existing lists
        async function loadExistingLists() {
            try {
                const response = await fetch(`http://localhost:${port}/api/lists`);
                const lists = await response.json();
                console.log(lists);

                // Clear existing lists
                existingListsContainer.innerHTML = '';

                // Populate existing lists
                lists.forEach(list => {
                    const listElement = document.createElement('div');
                    listElement.classList.add('list-item');
                    listElement.innerHTML = `
                        <span>${list}</span>
                        <div class="list-actions">
                            <a href="list.html?id='${list}'&port=${port}" class="btn btn-sm btn-primary">Open</a>
                            <button class="btn btn-sm btn-danger" onclick="deleteList('${list}')">Delete</button>
                        </div>
                    `;
                    existingListsContainer.appendChild(listElement);
                });

                // Show message if no lists
                if (lists.length === 0) {
                    existingListsContainer.innerHTML = '<p class="text-muted text-center">No shopping lists found</p>';
                }
            } catch (error) {
                console.error('Error loading lists:', error);
                existingListsContainer.innerHTML = '<p class="text-danger text-center">Failed to load lists</p>';
            }
        }

        // Delete a list
        async function deleteList(listId) {
            if (!confirm('Are you sure you want to delete this list?')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:${port}/api/lists/${listId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    // Reload lists
                    loadExistingLists();
                } else {
                    alert('Failed to delete list');
                }
            } catch (error) {
                console.error('Error deleting list:', error);
                alert('Failed to delete list');
            }
        }

        // Load lists when page loads
        loadExistingLists();

        // Allow creating list with Enter key
        newListNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                createListBtn.click();
            }
        });
    </script>
</body>
</html>
